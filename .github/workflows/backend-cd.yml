# CD del Backend (paso 29). Despliegue manual a VM de producción.
# - workflow_dispatch con input SHA (solo main, checks CI superados).
# - Verificación criptográfica del commit vía GitHub API.
# - OIDC + IAP para conectividad VM (sin claves SSH en GitHub).
# - Serialización estricta (max-parallel: 1, sin cancel-in-progress).
# - Ejecuta script de despliegue en VM con backup/migraciones/health-check/rollback.
# - Secretos fuera de paquetes/imágenes (OIDC, IAP, secretos GitHub para config).
# - NO ejecuta despliegue real sin aprobación; workflow preparado para validación local.

name: backend-cd

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: 'SHA completo del commit a desplegar (debe estar en main y haber pasado CI)'
        required: true
        type: string
      confirm:
        description: 'Escribe "DEPLOY" para confirmar (prevención de ejecuciones accidentales)'
        required: true
        type: string

concurrency:
  group: production-deploy
  max-parallel: 1
  # cancel-in-progress: false (implícito con max-parallel: 1)

permissions:
  id-token: write      # Para OIDC (autenticación GCP)
  contents: read       # Para checkout y API de checks
  actions: read        # Para leer resultados de checks de CI

jobs:
  validate-and-deploy:
    name: Validar y Desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # Secrets necesarios (configurar en GitHub Settings → Secrets → Actions):
    # - GCP_PROJECT_ID: ID del proyecto GCP
    # - GCP_WORKLOAD_IDENTITY_PROVIDER: Proveedor WIF (ej. projects/123/locations/global/workloadIdentityPools/pool/providers/provider)
    # - GCP_SERVICE_ACCOUNT: Cuenta de servicio para OIDC (ej. deployer@my-project.iam.gserviceaccount.com)
    # - VM_NAME: Nombre de la instancia VM (ej. renfe-notifier-vm)
    # - VM_ZONE: Zona GCP (ej. europe-west1-b)
    # - DEPLOY_USER: Usuario SSH en la VM (ej. ubuntu)
    steps:
      - name: Validar confirmación
        if: inputs.confirm != 'DEPLOY'
        run: |
          echo "Confirmación inválida. Debes escribir exactamente 'DEPLOY' en el campo confirm."
          exit 1

      - name: Checkout repositorio (para API checks)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verificar que el SHA pertenece a main
        id: check-main
        run: |
          SHA="${{ inputs.deploy_sha }}"
          # Verificar que el commit existe en main
          if ! git merge-base --is-ancestor "${SHA}" origin/main 2>/dev/null; then
            echo "ERROR: El commit ${SHA} no es ancestro de main (no está en la rama main)"
            exit 1
          fi
          # Verificar que no es un commit de merge vacío o similar
          COMMIT_MSG=$(git log -1 --format=%s "${SHA}")
          echo "Commit válido en main: ${SHA} (${COMMIT_MSG})"

      - name: Verificar checks de CI superados (GitHub API)
        id: check-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ inputs.deploy_sha }}"
          REPO="${{ github.repository }}"
          # Obtener el estado combinado de checks del commit
          STATUS=$(gh api repos/${REPO}/commits/${SHA}/status --jq '.state')
          CHECK_RUNS=$(gh api repos/${REPO}/commits/${SHA}/check-runs --jq '.check_runs[] | {name: .name, conclusion: .conclusion}' 2>/dev/null || echo '[]')
          echo "Estado combinado: ${STATUS}"
          echo "Check runs:"
          echo "${CHECK_RUNS}" | jq -c '.'
          # Validar estado combinado
          if [[ "${STATUS}" != "success" ]]; then
            echo "ERROR: El commit ${SHA} no tiene estado 'success' en CI (estado: ${STATUS})"
            echo "Despliegue abortado: no se conectará a infraestructura."
            exit 1
          fi
          # Validar que los jobs críticos existen y pasaron
          REQUIRED_JOBS=("backend-ci" "all-checks-ok")
          for JOB in "${REQUIRED_JOBS[@]}"; do
            CONCLUSION=$(echo "${CHECK_RUNS}" | jq -r --arg job "${JOB}" 'select(.name == $job) | .conclusion')
            if [[ -z "${CONCLUSION}" || "${CONCLUSION}" == "null" ]]; then
              echo "WARNING: Job requerido '${JOB}' no encontrado en checks"
            elif [[ "${CONCLUSION}" != "success" && "${CONCLUSION}" != "skipped" ]]; then
              echo "ERROR: Job requerido '${JOB}' no pasó (conclusion: ${CONCLUSION})"
              exit 1
            fi
          done
          echo "Todos los checks requeridos superados."

      - name: Autenticar con OIDC a GCP (Workload Identity Federation)
        id: auth-gcp
        uses: google-github-actions/auth@71fee32a0bb7e97b4d33d548e7d957010649d8fa # v2.1.3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@98ddc00a17442e89a24bbf282954a3b65ce6d200 # v2.1.0
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: 'gke-gcloud-auth-plugin'

      - name: Desplegar en VM vía IAP
        id: deploy-vm
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          VM_NAME: ${{ secrets.VM_NAME }}
          VM_ZONE: ${{ secrets.VM_ZONE }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          echo "Conectando a VM ${VM_NAME} en zona ${VM_ZONE} vía IAP..."
          # Copiar script de despliegue a la VM
          gcloud compute scp --tunnel-through-iap \
            --zone="${VM_ZONE}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            scripts/deploy_backend.sh \
            "${DEPLOY_USER}@${VM_NAME}:/tmp/deploy_backend.sh"
          # Ejecutar script en la VM con el SHA a desplegar
          gcloud compute ssh --tunnel-through-iap \
            --zone="${VM_ZONE}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            "${DEPLOY_USER}@${VM_NAME}" \
            --command="chmod +x /tmp/deploy_backend.sh && DEPLOY_SHA=${DEPLOY_SHA} /tmp/deploy_backend.sh"
          echo "Despliegue completado en VM."

      - name: Notificar resultado
        if: always()
        run: |
          RESULT="${{ job.status }}"
          if [[ "${RESULT}" == "success" ]]; then
            echo "✅ Despliegue exitoso para commit ${{ inputs.deploy_sha }}"
          else
            echo "❌ Despliegue fallido para commit ${{ inputs.deploy_sha }}"
            echo "Revisar logs del job para detalles. Rollback automático ejecutado en VM si corresponde."
          fi

  # Job de prueba local (no requiere secretos, valida lógica con mocks)
  validate-local:
    name: Validación Local (Dobles)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Validar script de despliegue (sintaxis + dry-run con mocks)
        run: |
          bash -n scripts/deploy_backend.sh
          echo "Script deploy_backend.sh: sintaxis OK"

      - name: Probar validación de commit (mock)
        run: |
          python -c "import sys, subprocess; result = subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/main'], capture_output=True); print(f'HEAD es ancestro de main: {result.returncode == 0}')"