# CI del backend (passo 26). Unico responsable: app y tests del servicio de
# avisos. No usa secretos, no contacta con Renfe ni con produccion, y todas
# las acciones estan fijadas por SHA (mitigacion de supply chain).
#
# - Disparo: push y pull requests sobre main.
# - Deteccion de cambios relevantes con dorny/paths-filter: si el PR/push no
#   toca backend/** (o este propio workflow), el job se omite limpiamente y el
#   job-fin (all-checks-ok) queda en exito, de modo que ningun check
#   obligatorio queda eternamente pendiente por filtros de ruta.
# - Concurrencia: solo un run activo por rama; commits nuevos cancelan el CI
#   obsoleto en marcha (ahorro de minutos de la cuota gratuita).
# - Permisos minimos: GITHUB_TOKEN con lectura de contenidos nada mas.
# - Python 3.11 para reproducir `requirements.lock` (resuelto en 3.11).

name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Filtrar cambios de backend
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'

  backend-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configurar Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock
      - name: Instalar dependencias (lock)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
      - name: Analisis estatico (ruff)
        run: ruff check .
      - name: Formato (ruff format)
        run: ruff format --check .
      - name: Tipos (mypy)
        run: mypy app tests
      - name: Pruebas unitarias (pytest)
        run: python -m pytest

  all-checks-ok:
    needs: backend-ci
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar resultado de CI backend
        run: |
          result="${{ needs.backend-ci.result }}"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "CI de backend finalizo con estado: $result"
            exit 1
          fi
          echo "CI de backend OK ($result)"