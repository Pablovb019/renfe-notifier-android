name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Lint Python code
        run: |
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run backend tests
        run: |
          python -m pytest backend/ -v

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Validate Kotlin syntax (basic)
        # We cannot compile Kotlin without the Android SDK, but we can check that files are not empty.
        run: |
          find src/main/java -name "*.kt" -type f -exec sh -c 'echo "Checking $1"; head -5 "$1"' _ {} \;
          echo "Kotlin files present."

      - name: Ensure Android test files exist
        run: |
          if [ -d src/test/java ]; then
            echo "Android test directory found."
          else
            echo "Android test directory missing."
            exit 1
          fi