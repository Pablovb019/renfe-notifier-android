# Memoria del daemon de Gradle para compilar con AGP + Compose en Windows.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX obligatorio en proyectos modernos.
android.useAndroidX=true
# Estilo de código oficial de Kotlin.
kotlin.code.style=official
# Mantener las clases R solo en el paquete del módulo (menor tamaño y conflictos).
android.nonTransitiveRClass=true